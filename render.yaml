services:
  # ─── Backend: FastAPI Web Service ───────────────────────────────────────────
  - type: web
    name: ai-knowledge-base-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You will set this manually in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////opt/render/project/src/knowledge_base.db
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1

  # ─── Frontend: Static Site ──────────────────────────────────────────────────
  - type: web
    name: ai-knowledge-base-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false          # Set this to your backend URL e.g. https://ai-knowledge-base-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
